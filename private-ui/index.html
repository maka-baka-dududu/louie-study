/* Q&A occupies the viewport. Only the conversation or selected pane scrolls. */
body.qa-page{height:100vh;height:100dvh;overflow:hidden}
.qa-page main{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:20px;padding-bottom:20px}
.qa-page header{flex:none;padding-bottom:12px;min-height:35px}
.qa-page #view{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.qa-page .pagehead{flex:none;margin:15px 0 12px;min-height:37px}
.qa-page .pagehead h1{font-size:27px}
.qa-page .teacher-tabs{flex:none;margin:0 0 12px;padding-bottom:9px}
.qa-page .teacher-pane{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.qa-page .teacher-pane.chat-pane{overflow:hidden}
.qa-page .teacher-layout{height:100%;min-height:0;align-items:stretch}
.qa-page .teacher-history{position:static;display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}
.qa-page .teacher-history>.teacher-new{flex:none}
.qa-page .teacher-thread-list{max-height:none;min-height:0;flex:1;display:flex;flex-direction:column;overflow:auto}
.qa-page .teacher-thread{flex:none}
.qa-page .teacher-delete-thread{flex:none;margin-top:12px}
.qa-page .teacher-conversation{display:flex;flex-direction:column;height:100%;min-height:0}
.qa-page .teacher-messages{height:auto;min-height:0;flex:1;padding:22px;overscroll-behavior:contain}
.qa-page .teacher-composer{flex:none;padding:12px 14px}
.qa-page .teacher-composer textarea{height:65px;min-height:45px;max-height:100px;resize:none}
.qa-page .teacher-composer-tools{margin-top:7px}
.qa-page .teacher-welcome{margin:clamp(8px,4vh,40px) 0}
.qa-page .teacher-error{flex:none;max-height:70px;overflow:auto;margin-bottom:10px;padding:8px 12px}
@media(max-width:850px){
 body.qa-page{display:flex;flex-direction:column}
 .qa-page aside{flex:none;padding:12px 16px 9px}
 .qa-page aside nav{margin-top:10px}
 .qa-page main{flex:1;height:auto;min-height:0;padding:10px 16px 12px}
 .qa-page .pagehead{margin:10px 0 8px;min-height:32px}
 .qa-page .pagehead h1{font-size:23px}
 .qa-page header{min-height:26px;padding-bottom:6px}
 .qa-page .teacher-tabs{margin-bottom:9px;padding-bottom:7px}
}
@media(max-width:700px){

/* Keep the stars visible behind the real app shell, not only the preview. */
body.private-shell.private-shell>main{background:transparent!important}.private-shell #view{background:transparent!important}
/* Visible night-sky depth, rather than isolated pinpoints on a black canvas. */

@keyframes private-nebula-flow{0%{transform:translate3d(-1.5%,-1%,0) scale(1);opacity:.68}100%{transform:translate3d(2%,1.5%,0) scale(1.09);opacity:1}}
@keyframes private-sky-drift{0%{transform:translate3d(0,0,0);opacity:.6}45%{opacity:.95}100%{transform:translate3d(-26px,-38px,0);opacity:.74}}
.private-shell button.private-portal{background:linear-gradient(140deg,rgba(24,28,43,.9),rgba(14,17,29,.88))!important}
@media(max-width:650px){.private-stars:after{background-size:390px 300px}.private-stars:before{opacity:.8}}
@media(prefers-reduced-motion:reduce){.private-stars:before,.private-stars:after{animation:none;will-change:auto}}
